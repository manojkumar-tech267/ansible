- name: Install and Uninstall Multiple Packages in Ansible
  hosts: local 
  connection: local 
  become: yes 


  tasks:
    - name: Install and Uninstall packages 
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop:
        - { name: "nginx", state: "present" }
        - { name: "mysql", state: "present" }
        - { name: "zip", state: "present" }
        - { name: "unzip", state: "present" }