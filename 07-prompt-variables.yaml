- name: Prompt Level Variables in Ansible 
  hosts: local 
  connection: local 
  vars_prompt:
    - name: username 
      prompt: Enter your username
      private: false 
    - name: password 
      prompt: Enter your password
      private: true


  tasks:
    - name: Printing Username and Password 
      ansible.builtin.debug:
        msg: "Your Username is {{ username }} and Your Password is {{ password }}"